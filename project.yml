name: SquadComms
options:
  bundleIdPrefix: com.connor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.16.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.1"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.26.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.69.6"

targets:
  SquadComms:
    type: application
    platform: iOS
    sources:
      - path: Sources/SquadComms
    info:
      path: Sources/SquadComms/Support/Info.plist
      properties:
        CFBundleDisplayName: squad comms
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio, voip, processing]
        NSMicrophoneUsageDescription: squad comms uses your microphone so your squad hears you without touching your phone.
        NSSpeechRecognitionUsageDescription: Voice commands let you mute, unmute and rewind hands-free.
        NSBluetoothAlwaysUsageDescription: Used to detect which squad members are physically nearby.
        BGTaskSchedulerPermittedIdentifiers: [com.connor.openline.keepalive]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.openline
        DEVELOPMENT_TEAM: XF783932R2
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PROVISIONING_PROFILE_SPECIFIER: SquadComms CI 3
        CODE_SIGN_IDENTITY: Apple Distribution
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: Supabase
        product: Supabase
      - package: Sentry
        product: Sentry
      - package: PostHog
        product: PostHog
