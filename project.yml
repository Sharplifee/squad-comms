name: SquadComms
options:
  bundleIdPrefix: com.connor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.16.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.1"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.26.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.69.6"

targets:
  SquadComms:
    type: application
    platform: iOS
    sources:
      - path: Sources/SquadComms
      - path: Sources/SquadComms/Resources/Assets.xcassets
        type: folder
    info:
      path: Sources/SquadComms/Support/Info.plist
      properties:
        CFBundleDisplayName: squad comms
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "177"
        UILaunchScreen: {}
        UIBackgroundModes: [audio, voip, processing]
        NSMicrophoneUsageDescription: squad comms uses your microphone so your squad hears you without touching your phone.
        # LiveKit links the camera capture APIs even though this app is audio
        # only and never opens a camera. Apple scans the binary, not the code
        # path, so the purpose string is required or upload fails ITMS-90683.
        NSCameraUsageDescription: squad comms does not use the camera. Its audio library links Apple's camera APIs, so this permission is never requested.
        NSLocalNetworkUsageDescription: squad comms connects directly to your squad members' devices on the same network for low-latency audio.
        NSSpeechRecognitionUsageDescription: Voice commands let you mute, unmute and rewind hands-free.
        NSContactsUsageDescription: Squadstream checks which of your contacts already have the app. Numbers are scrambled on your phone before anything is sent — nothing readable ever leaves the device.
        NSBluetoothAlwaysUsageDescription: Used to detect which squad members are physically nearby.
        BGTaskSchedulerPermittedIdentifiers: [com.connor.openline.keepalive]
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.openline
        DEVELOPMENT_TEAM: XF783932R2
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PROVISIONING_PROFILE_SPECIFIER: SquadComms CI 6
        CODE_SIGN_IDENTITY: Apple Distribution
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: Supabase
        product: Supabase
      - package: Sentry
        product: Sentry
      - package: PostHog
        product: PostHog
