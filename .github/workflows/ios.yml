name: iOS build and TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Apple rejects uploads built with anything older than the iOS 26 SDK,
      # so the runner must be macos-26 with Xcode 26 selected.
      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i '^Xcode' || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Five separate times this codebase has shipped a control bound to a
      # preference nothing reads — the duck, self-monitor, noise suppression,
      # auto-pause, then the music choice and the visibility picker. Every one
      # was invisible in review and on device: the UI responds and nothing
      # happens. Cheap to check, so check it every build.
      - name: Audit for dead settings
        run: python3 scripts/audit_dead_controls.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          APPLE_DIST_P12: ${{ secrets.APPLE_DIST_P12 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          echo "$APPLE_DIST_P12" | base64 --decode > /tmp/dist.p12

          security create-keychain -p runner build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          security unlock-keychain -p runner build.keychain

          # The leaf certificate alone cannot chain to a trusted root on a
          # fresh keychain, which surfaces as "certificate is invalid ... may
          # have been revoked or expired". Import the WWDR intermediate first.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o /tmp/wwdr.cer
          security import /tmp/wwdr.cer -k build.keychain -T /usr/bin/codesign || true

          security import /tmp/dist.p12 -k build.keychain -P "$APPLE_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner build.keychain

          echo "--- identities visible to codesign ---"
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        env:
          APPLE_PROVISION_PROFILE: ${{ secrets.APPLE_PROVISION_PROFILE }}
          APPLE_WIDGET_PROFILE: ${{ secrets.APPLE_WIDGET_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISION_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/squadcomms.mobileprovision
          # The widget extension has its own bundle id and therefore its own
          # profile. Without it the archive fails at the embed step rather than
          # at app signing, which is a confusing place to discover it.
          echo "$APPLE_WIDGET_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/widgets.mobileprovision

      - name: Generate project and write build configuration
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          # XcodeGen regenerates Info.plist from project.yml, so it MUST run
          # BEFORE we inject runtime config. The old order injected first then
          # generated, which wiped every key and shipped the app "not
          # configured" — that was the Opening-the-line / Couldn't-connect bug.
          xcodegen generate
          PLIST=Sources/SquadComms/Support/Info.plist
          setkey() {
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"
          }
          setkey LIVEKIT_URL "$LIVEKIT_URL"
          setkey SUPABASE_URL "$SUPABASE_URL"
          setkey SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
          setkey SENTRY_DSN "$SENTRY_DSN"
          setkey POSTHOG_API_KEY "$POSTHOG_API_KEY"
          BUILD=$((GITHUB_RUN_NUMBER + 100))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "--- config keys in Info.plist (masked) ---"
          for k in LIVEKIT_URL SUPABASE_URL SUPABASE_ANON_KEY; do
            v=$(/usr/libexec/PlistBuddy -c "Print :$k" "$PLIST" 2>/dev/null)
            if [ -n "$v" ]; then echo "$k = ${v:0:18}... (len ${#v})"; else echo "$k = MISSING"; exit 1; fi
          done
          echo "CFBundleVersion = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"

      # Runs before the archive so a dead control fails in seconds rather
      # than after a full build, an upload, and somebody finding a slider that
      # does nothing.
      - name: Audit for dead controls
        run: python3 scripts/audit_dead_controls.py

      - name: Archive
        run: |
          xcodebuild -project SquadComms.xcodeproj \
            -scheme SquadComms \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SquadComms.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.connor.openline</key><string>SquadComms CI 6</string>
              <key>com.connor.openline.widgets</key><string>SquadComms Widgets CI</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/SquadComms.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/export

      # Artifact storage quota must never block the TestFlight upload.
      # Run 7 (2026-08-14) archived and exported a signed IPA successfully and
      # then failed here on "Artifact storage quota has been hit", which stopped
      # the upload step from ever running. Keeping the IPA is a convenience;
      # shipping it is the point.
      - name: Keep the signed IPA
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SquadComms-ipa
          path: build/export/*.ipa
          retention-days: 7

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA=$(ls build/export/*.ipa | head -1)
          echo "Uploading $IPA"
          # Apple returns a 409 on the 'buildUpload' relationship when a prior
          # delivery for the same build slot is still holding a lock. It clears
          # on its own within a minute or two, so retry rather than fail the
          # whole run over a transient server-side lock.
          # altool exits non-zero on a 409 even when the delivery landed —
          # builds 3, 4 and 7 all went VALID at Apple while this step reported
          # failure. Ask App Store Connect what it actually has rather than
          # trusting the exit code, and never blind-retry altool: re-uploading
          # a build that already exists produces "the entity has been replaced".
          set +e
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          UPLOAD_STATUS=$?
          set -e
          if [ $UPLOAD_STATUS -eq 0 ]; then
            echo "Upload reported success"
            exit 0
          fi
          echo "altool exited $UPLOAD_STATUS - verifying against App Store Connect"
          pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 scripts/verify_upload.py 6805307212 "$BUILD_NUMBER"
