name: iOS build and TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          APPLE_DIST_P12: ${{ secrets.APPLE_DIST_P12 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          echo "$APPLE_DIST_P12" | base64 --decode > /tmp/dist.p12
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "$APPLE_DIST_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner build.keychain

      - name: Install provisioning profile
        env:
          APPLE_PROVISION_PROFILE: ${{ secrets.APPLE_PROVISION_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISION_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/squadcomms.mobileprovision

      - name: Write build configuration
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :LIVEKIT_URL string $LIVEKIT_URL" Sources/SquadComms/Support/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_URL string $SUPABASE_URL" Sources/SquadComms/Support/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_ANON_KEY string $SUPABASE_ANON_KEY" Sources/SquadComms/Support/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :SENTRY_DSN string $SENTRY_DSN" Sources/SquadComms/Support/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :POSTHOG_API_KEY string $POSTHOG_API_KEY" Sources/SquadComms/Support/Info.plist || true
          xcodegen generate

      - name: Archive
        run: |
          xcodebuild -project SquadComms.xcodeproj \
            -scheme SquadComms \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SquadComms.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/SquadComms.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/export

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f build/export/SquadComms.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
